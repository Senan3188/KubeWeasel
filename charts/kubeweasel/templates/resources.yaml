{{- $private := .Values.privateHttp | default dict -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, create, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
  - apiGroups: [cert-manager.io]
    resources: [certificates, issuers]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create]
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, create, patch, delete]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if $private.enabled }}
            - name: KUBEWEASEL_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
            - name: KUBEWEASEL_BIND
              value: {{ if $private.enabled }}"$(KUBEWEASEL_POD_IP):7878"{{ else if .Values.publicOrigin }}"0.0.0.0:7878"{{ else }}"127.0.0.1:7878"{{ end }}
            - name: KUBEWEASEL_AUTH_DB
              value: "/data/kubeweasel.db"
            {{- if .Values.publicOrigin }}
            - name: KUBEWEASEL_PUBLIC_ORIGIN
              value: {{ .Values.publicOrigin | quote }}
            {{- end }}
            {{- if $private.enabled }}
            - name: KUBEWEASEL_PRIVATE_ORIGIN
              value: {{ $private.origin | quote }}
            {{- end }}
            - name: KUBEWEASEL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          startupProbe:
            exec:
              command: [kubeweasel, --healthcheck]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [kubeweasel, --healthcheck]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [kubeweasel, --healthcheck]
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: auth-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: auth-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" .Release.Name) | quote }}
