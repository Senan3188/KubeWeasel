{{- $private := .Values.privateHttp | default dict -}}
{{- if $private.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-access
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-access
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-access
      annotations:
        kubeweasel.io/private-url: {{ $private.origin | quote }}
        checksum/config: {{ include (print $.Template.BasePath "/private-access-config.yaml") . | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchFields:
                  - key: metadata.name
                    operator: In
                    values: [{{ $private.nodeName | quote }}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: access
          image: {{ include "kubeweasel.privateProxyImage" . | quote }}
          command: [nginx]
          args: [-g, "daemon off;"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: configuration
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: temporary
              mountPath: /tmp
          startupProbe:
            httpGet:
              host: {{ $private.bindAddress | quote }}
              port: {{ $private.port }}
              path: /healthz
              httpHeaders:
                - name: Host
                  value: {{ trimSuffix "/" (trimPrefix "http://" $private.origin) | quote }}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              host: {{ $private.bindAddress | quote }}
              port: {{ $private.port }}
              path: /healthz
              httpHeaders:
                - name: Host
                  value: {{ trimSuffix "/" (trimPrefix "http://" $private.origin) | quote }}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 8Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 64Mi
      volumes:
        - name: configuration
          configMap:
            name: {{ .Release.Name }}-access
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
{{- end }}
