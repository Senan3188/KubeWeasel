image:
  repository: kubeweasel
  tag: "0.1.0"
  pullPolicy: IfNotPresent
# Read-only cluster-scoped ingress-class discovery for networking diagnostics.
# Disable when an administrator does not grant cluster-scoped discovery.
ingressClassDiscovery: true
# Optional read-only cluster view: node capacity, node usage, all-pod reservations.
nodeMonitoring: true
# Set an HTTPS origin only when a reverse proxy terminates TLS for this host.
publicOrigin: ""
persistence:
  size: 1Gi
  storageClass: ""
