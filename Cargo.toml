[package]
name = "kubeweasel"
version = "0.3.1"
edition = "2024"
description = "An approachable Kubernetes application dashboard"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
ring = "0.17"
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kube = { version = "5.1", features = ["client", "rustls-tls", "ring", "ws"], default-features = false }
k8s-openapi = { version = "0.29", features = ["v1_35"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
